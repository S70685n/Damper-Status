
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damper Build Status</title>

<style>
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --primary: #808080;
  --primary-light: #365675;
  --text: #000000;
  --muted: #718096;
  --border: #dce2e8;
  --shadow: 0 3px 12px rgba(20,35,50,.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

button, input, select, textarea {
  font: inherit;
}

button { cursor: pointer; }

header {
  background: var(--primary);
  color: white;
  padding: 22px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

header h1 {
  margin: 0;
  font-size: 23px;
}

.header-subtitle {
  color: #cbd5df;
  font-size: 13px;
  margin-top: 5px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 22px;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 10px 14px;
  font-weight: 600;
}

.primary-btn {
  background: var(--primary);
  color: white;
}

.primary-btn:hover {
  background: var(--primary-light);
}

.secondary-btn {
  background: #e8edf2;
  color: var(--primary);
}

.danger-btn {
  background: #fde8e8;
  color: #b42318;
}

.small-btn {
  padding: 7px 10px;
  font-size: 12px;
}

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}

.tab {
  background: #e1e7ed;
  color: var(--primary);
  border: 1px solid transparent;
}

.tab.active {
  background: var(--primary);
  color: white;
}

.add-tab {
  background: white;
  border: 1px dashed #9aa8b5;
  color: var(--primary);
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
}

.toolbar h2 {
  margin: 0;
  font-size: 21px;
}

.search {
  width: 260px;
  max-width: 100%;
}

input, select, textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: white;
  color: var(--text);
}

textarea {
  resize: vertical;
  min-height: 95px;
}

.group-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 15px;
}

.group-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 17px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.group-card h3 {
  margin: 0;
  font-size: 18px;
  overflow-wrap: anywhere;
}

.group-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.part-number {
  font-weight: bold;
  color: #000000;

}

.category {
  color: var(--muted);
  font-size: 13px;
}

.notes {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.5;
}

.status {
  display: inline-block;
  border-radius: 20px;
  padding: 5px 9px;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
}

.status-not-started {
  background: #edf0f3;
  color: #59636e;
}

.status-in-progress {
  background: #fff1d6;
  color: #9a6500;
}

.status-hold {
  background: #fce7e7;
  color: #ad2929;
}

.status-complete {
  background: #dff4e5;
  color: #23733b;
}

.card-actions {
  display: flex;
  gap: 8px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
  margin-top: auto;
}

.card-actions button {
  flex: 1;
}

.empty {
  text-align: center;
  background: white;
  border: 1px dashed #b9c4ce;
  border-radius: 10px;
  padding: 40px 20px;
  color: var(--muted);
}

.empty h3 {
  color: var(--text);
  margin-top: 0;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 10;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.modal.show {
  display: flex;
}

.modal-content {
  background: white;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 12px;
  padding: 22px;
  box-shadow: 0 10px 35px rgba(0,0,0,.2);
}

.modal-content h2 {
  margin: 0 0 18px;
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 6px;
}

.modal-actions {
  display: flex;
  gap: 9px;
  margin-top: 20px;
}

.modal-actions button {
  flex: 1;
}

.footer-tools {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 25px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

.footer-note {
  color: var(--muted);
  font-size: 12px;
  margin-top: 12px;
}

.group-count {
  color: var(--muted);
  font-size: 13px;
}

@media(max-width:600px) {
  .container { padding: 15px; }
  header { padding: 18px 15px; }
  header h1 { font-size: 20px; }
  .header-inner { align-items: flex-start; }
  .toolbar { align-items: stretch; }
  .search { width: 100%; }
  .group-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <h1>Damper Build Status</h1>
      <div class="header-subtitle">2.5" Pro Truck Series</div>
    </div>
    <button class="secondary-btn small-btn" onclick="openTabManager()">
      Manage Tabs
    </button>
  </div>
</header>

<div class="container">

  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <div>
      <h2 id="currentTabTitle">Vehicle Manufacture</h2>
      <div class="group-count" id="groupCount"></div>
    </div>

    <input
      class="search"
      id="searchInput"
      placeholder="Search groups, part number, build process..."
      oninput="renderGroups()"
    >
  </div>

  <div id="groupsContainer" class="group-grid"></div>
  <div style="margin-top:18px;">
  <button class="primary-btn" onclick="openGroupModal()">
    + Add Group
  </button>
</div>

  </div>

</div>

<!-- GROUP MODAL -->

<div class="modal" id="groupModal">
  <div class="modal-content">
    <h2 id="groupModalTitle">Add Group</h2>

    <form id="groupForm">

      <div class="form-group">
        <label for="groupName">Group Number</label>
        <input id="groupName" required placeholder="Enter group number">
      </div>

      <div class="form-group">
        <label for="groupPart">Part Number</label>
        <input id="groupPart" placeholder="Enter part number">
      </div>

      <div class="form-group">
<label for="groupCategory">Currect build process</label>
<select id="groupCategory">
  <option value="">Select a build process</option>
  <option value="ASTG">ASTG</option>
  <option value="FILL">FILL</option>
  <option value="DYNO">DYNO</option>
  <option value="CAPP">CAPP</option>
  <option value="DLBL">DLBL</option>
  <option value="REND">REND</option>
  <option value="UBSH">UBSH</option>
  <option value="BOOT">BOOT</option>
  <option value="DFA1">DFA1</option>
  <option value="QAD">QAD</option>
  <option value="BAG5">BAG5</option>
  <option value="WVE">WVE</option>
  <option value="S5">S5</option>
</select>
      </div>

      <div class="form-group">
        <label for="groupStatus">Group Status</label>
        <select id="groupStatus">
          <option value="Not Started">Not Started</option>
          <option value="In Progress">In Progress</option>
          <option value="Parts Hold">Parts Hold</option>
          <option value="Tooling Hold">Tooling Hold</option>
          <option value="Engineering Hold">Engineering Hold</option>
          <option value="QA Hold">QA Hold</option>
          <option value="Other Hold">Other Hold</option>
          <option value="Complete">Complete</option>
        </select>
      </div>

      <div class="form-group">
        <label for="groupNotes">Notes</label>
        <textarea id="groupNotes" placeholder="Enter notes or updates..."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="secondary-btn" onclick="closeGroupModal()">
          Cancel
        </button>
        <button type="submit" class="primary-btn">
          Save Group
        </button>
      </div>

    </form>
  </div>
</div>

<!-- TAB MANAGER MODAL -->

<div class="modal" id="tabModal">
  <div class="modal-content">
    <h2>Manage Vehicle Manufacture Tabs</h2>

    <div class="form-group">
      <label for="newTabName">New Tab Name</label>
      <input id="newTabName" placeholder="Enter tab name">
    </div>

    <button class="primary-btn" onclick="addTab()">+ Add Tab</button>

    <hr style="border:0;border-top:1px solid var(--border);margin:20px 0;">

    <div id="tabManagerList"></div>

    <div class="modal-actions">
      <button class="secondary-btn" onclick="closeTabManager()">Close</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "workFlowOrganizerStandalone_v1";

let data = {
  tabs: [
    {
      id: 1,
      name: "Manufacture Name",
      groups: []
    }
  ],
  activeTabId: 1
};

let editingGroupId = null;

function normalizeData(saved) {
  if (!saved || !Array.isArray(saved.tabs)) return null;

  saved.tabs = saved.tabs.map(tab => ({
    ...tab,
    groups: Array.isArray(tab.groups)
      ? tab.groups
      : Array.isArray(tab.tasks)
        ? tab.tasks
        : []
  }));

  saved.tabs.forEach(tab => {
    delete tab.tasks;
  });

  if (!saved.tabs.some(t => t.id === saved.activeTabId)) {
    saved.activeTabId = saved.tabs[0]?.id ?? null;
  }

  return saved;
}

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = normalizeData(JSON.parse(saved));
      if (parsed) data = parsed;
    }
  } catch (error) {
    console.error("Could not load saved data:", error);
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (error) {
    alert("Unable to save data. Please export a backup and check browser storage.");
  }
}

function currentTab() {
  return data.tabs.find(t => t.id === data.activeTabId);
}

function renderTabs() {
  const container = document.getElementById("tabs");
  container.innerHTML = "";

  data.tabs.forEach(tab => {
    const button = document.createElement("button");
    button.className = "tab" +
      (tab.id === data.activeTabId ? " active" : "");
    button.textContent = tab.name;
    button.onclick = () => {
      data.activeTabId = tab.id;
      saveData();
      render();
    };
    container.appendChild(button);
  });
  
}

function renderGroups() {
  const tab = currentTab();
  const container = document.getElementById("groupsContainer");
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  const searching = search.length > 0;

  // Search all tabs when a search term is entered.
  // Otherwise, show only the currently selected tab.
  
  const sourceTabs = searching
    ? data.tabs
    : (tab ? [tab] : []);

  const results = [];

  sourceTabs.forEach(workTab => {
    workTab.groups.forEach(group => {
      const content = [
        group.name,
        group.part,
        group.category,
        group.status,
        group.notes
      ].join(" ").toLowerCase();

      if (!searching || content.includes(search)) {
        results.push({
          group: group,
          tab: workTab
        });
      }
    });
  });

  document.getElementById("currentTabTitle").textContent =
    searching ? "Search Results - All Tabs" : (tab ? tab.name : "No Work Areas");

 document.getElementById("groupCount").textContent =
  tab
    ? `${tab.groups.length} ${tab.groups.length === 1 ? "Group" : "Groups"}`
    : "";
  
  container.innerHTML = "";

  if (results.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.style.gridColumn = "1 / -1";

    empty.innerHTML = `
      <h3>${searching ? "No groups found" : "No groups yet"}</h3>
      <p>${searching
        ? "Try another group name, part number, or search term."
        : "Add your first group to tab."}</p>
    `;

    container.appendChild(empty);
    return;
  }

  results.forEach(result => {
    const group = result.group;
    const workTab = result.tab;

    const card = document.createElement("div");
    card.className = "group-card";

    // Show which main tab contains this group.
    const tabLabel = document.createElement("div");
    tabLabel.className = "category";
    tabLabel.style.fontWeight = "bold";
    
    const top = document.createElement("div");
    top.className = "group-top";

    const title = document.createElement("h3");
    title.textContent = group.name || "Untitled Group";

    const status = document.createElement("span");
    status.className = "status " + statusClass(group.status);
    status.textContent = group.status || "Not Started";

    top.append(title, status);

    const part = document.createElement("div");
    part.className = "part-number";
    part.textContent = "Part Number: " + (group.part || "Not entered");

    const category = document.createElement("div");
    category.className = "category";
    category.textContent = "Current build process: " + (group.category || "Not entered");

    const notesLabel = document.createElement("strong");
    notesLabel.textContent = "Notes";

    const notes = document.createElement("div");
    notes.className = "notes";
    notes.textContent = group.notes || "No notes added.";

    const actions = document.createElement("div");
    actions.className = "card-actions";

    const edit = document.createElement("button");
    edit.className = "secondary-btn small-btn";
    edit.textContent = "Edit Group";

    edit.onclick = () => {
      data.activeTabId = workTab.id;
      saveData();
      render();
      openGroupModal(group.id);
    };

    const del = document.createElement("button");
    del.className = "danger-btn small-btn";
    del.textContent = "Delete";

    del.onclick = () => deleteGroup(group.id, workTab.id);

    actions.append(edit, del);

    card.append(
      tabLabel,
      top,
      part,
      category,
      notesLabel,
      notes,
      actions
    );

    container.appendChild(card);
  });
}
  
function statusClass(status) {
  switch (status) {
    case "In Progress": return "status-in-progress";
    case "On Hold": return "status-on-hold";
    case "Complete": return "status-complete";
    default: return "status-not-started";
  }
}

function render() {
  renderTabs();
  renderGroups();
}

function openGroupModal(id = null) {
  const tab = currentTab();
  if (!tab) {
    alert("Please create a Vehicle Manufacture tab first.");
    return;
  }

  editingGroupId = id;
  const group = id
    ? tab.groups.find(g => g.id === id)
    : null;

  document.getElementById("groupModalTitle").textContent =
    group ? "Edit Group" : "Add Group";

  document.getElementById("groupName").value = group?.name || "";
  document.getElementById("groupPart").value = group?.part || "";
  document.getElementById("groupCategory").value = group?.category || "";
  document.getElementById("groupStatus").value =
    group?.status || "Not Started";
  document.getElementById("groupNotes").value = group?.notes || "";

  document.getElementById("groupModal").classList.add("show");
}

function closeGroupModal() {
  document.getElementById("groupModal").classList.remove("show");
  editingGroupId = null;
}

document.getElementById("groupForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const tab = currentTab();
  if (!tab) return;

  const group = {
    id: editingGroupId || Date.now(),
    name: document.getElementById("groupName").value.trim(),
    part: document.getElementById("groupPart").value.trim(),
    category: document.getElementById("groupCategory").value.trim(),
    status: document.getElementById("groupStatus").value,
    notes: document.getElementById("groupNotes").value.trim()
  };

  if (!group.name) {
    alert("Please enter a Group Number.");
    return;
  }

  if (editingGroupId) {
    const index = tab.groups.findIndex(g => g.id === editingGroupId);
    if (index !== -1) tab.groups[index] = group;
  } else {
    tab.groups.push(group);
  }

  saveData();
  closeGroupModal();
  render();
});

function deleteGroup(id, tabId) {
  const tab = data.tabs.find(t => t.id === tabId);

  if (!tab) return;

  if (!confirm("Are you sure you want to delete this group?")) return;

  tab.groups = tab.groups.filter(g => g.id !== id);

  saveData();
  renderGroups();
}

function openTabManager() {
  renderTabManager();
  document.getElementById("tabModal").classList.add("show");
}

function closeTabManager() {
  document.getElementById("tabModal").classList.remove("show");
}

function renderTabManager() {
  const container = document.getElementById("tabManagerList");
  container.innerHTML = "";

  data.tabs.forEach(tab => {
    const row = document.createElement("div");
    row.style.cssText =
      "display:flex;gap:8px;align-items:center;margin-bottom:10px;";

    const name = document.createElement("span");
    name.textContent = tab.name;
    name.style.cssText = "flex:1;font-weight:bold;";

    const rename = document.createElement("button");
    rename.className = "secondary-btn small-btn";
    rename.textContent = "Rename";
    rename.onclick = () => renameTab(tab.id);

    const del = document.createElement("button");
    del.className = "danger-btn small-btn";
    del.textContent = "Delete";
    del.onclick = () => deleteTab(tab.id);

    row.append(name, rename, del);
    container.appendChild(row);
  });
}

function addTab() {
  const input = document.getElementById("newTabName");
  const name = input.value.trim();

  if (!name) {
    alert("Please enter a tab name.");
    return;
  }

  const tab = {
    id: Date.now(),
    name,
    groups: []
  };

  data.tabs.push(tab);
  data.activeTabId = tab.id;

  input.value = "";
  saveData();
  render();
  renderTabManager();
}

function renameTab(id) {
  const tab = data.tabs.find(t => t.id === id);
  if (!tab) return;

  const name = prompt("Enter the new tab name:", tab.name);
  if (name === null) return;

  if (!name.trim()) {
    alert("Tab name cannot be empty.");
    return;
  }

  tab.name = name.trim();
  saveData();
  render();
  renderTabManager();
}

function deleteTab(id) {
  const tab = data.tabs.find(t => t.id === id);
  if (!tab) return;

  if (data.tabs.length <= 1) {
    alert("You must keep at least one tab.");
    return;
  }

  if (!confirm(
    `Delete "${tab.name}" and all of its groups? This cannot be undone.`
  )) return;

  data.tabs = data.tabs.filter(t => t.id !== id);

  if (data.activeTabId === id) {
    data.activeTabId = data.tabs[0].id;
  }

  saveData();
  render();
  renderTabManager();
}

// Close modals when clicking outside their content.
document.getElementById("groupModal").addEventListener("click", function(event) {
  if (event.target === this) closeGroupModal();
});

document.getElementById("tabModal").addEventListener("click", function(event) {
  if (event.target === this) closeTabManager();
});

loadData();
render();
</script>

</body>
</html>
